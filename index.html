<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GupyMesa - Login</title>
    <link rel="icon" type="image/png" href="./assets/img/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { max-width: 180px; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="./assets/img/logo.png" alt="Logo" class="logo">
        <input type="text" id="id_usuario" placeholder="ID de Acesso (Ex: 1)" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button id="btn-entrar">ENTRAR</button>
    </div>

    <script type="module">
        import { AuthEngine } from './src/engines/AuthEngine.js?v=2';

        document.getElementById('btn-entrar').addEventListener('click', () => {
            const id = document.getElementById('id_usuario').value;
            const senha = document.getElementById('senha').value;
            if(id && senha) {
                AuthEngine.login(id, senha);
            } else {
                alert('Preencha todos os campos');
            }
        });
    </script>
</body>
</html>
