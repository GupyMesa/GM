<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GupyMesa - Login Corporativo</title>
    
    <link rel="icon" type="image/png" href="./assets/img/favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            max-width: 180px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="./assets/img/logo.png" alt="Logo GupyMesa" class="logo">

        <div class="form-group">
            <label for="id_usuario">ID de Acesso</label>
            <input type="text" id="id_usuario" placeholder="Digite seu ID (Ex: 1)" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha" required>
        </div>

        <button id="btn-entrar">ACESSAR SISTEMA</button>

        <div class="footer">
            &copy; 2026 GupyMesa. Acesso Restrito.
        </div>
    </div>

    <script type="module">
        import { AuthEngine } from './src/engines/AuthEngine.js';

        const btnEntrar = document.getElementById('btn-entrar');
        const inputId = document.getElementById('id_usuario');
        const inputSenha = document.getElementById('senha');

        // Função para acionar o login
        async function realizarLogin() {
            const id = inputId.value.trim();
            const senha = inputSenha.value.trim();

            if (!id || !senha) {
                alert('Por favor, preencha o ID e a Senha para continuar.');
                return;
            }

            // Muda o texto do botão para dar feedback visual
            const textoOriginal = btnEntrar.innerText;
            btnEntrar.innerText = "Verificando...";
            btnEntrar.disabled = true;

            try {
                // Chama o motor de autenticação
                await AuthEngine.login(id, senha);
            } catch (erro) {
                console.error(erro);
                alert('Erro inesperado. Tente novamente.');
            } finally {
                // Restaura o botão caso o redirecionamento falhe ou senha esteja errada
                btnEntrar.innerText = textoOriginal;
                btnEntrar.disabled = false;
            }
        }

        // Evento de clique no botão
        btnEntrar.addEventListener('click', realizarLogin);

        // Evento para aceitar a tecla "Enter" nos campos
        document.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                realizarLogin();
            }
        });
    </script>
</body>
</html>
