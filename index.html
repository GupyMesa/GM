<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GupyMesa - Acesso Restrito</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --white: #ffffff; }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #050505 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 60px 50px;
            border-radius: 45px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.6);
        }

        .brand-icon { width: 75px; margin-bottom: 25px; }
        h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 5px; letter-spacing: -1px; }
        .tagline { color: rgba(255, 255, 255, 0.4); margin-bottom: 40px; font-size: 0.95rem; }

        .form-group { text-align: left; margin-bottom: 25px; }
        label { 
            display: block; font-size: 0.75rem; font-weight: 700; 
            color: rgba(255, 255, 255, 0.5); text-transform: uppercase; 
            margin-bottom: 10px; margin-left: 5px;
        }

        input {
            width: 100%; box-sizing: border-box;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 22px;
            border-radius: 20px;
            color: #fff; font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none; border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-submit {
            width: 100%; padding: 20px;
            background: var(--white); color: #000;
            border: none; border-radius: 20px;
            font-size: 1.05rem; font-weight: 800;
            cursor: pointer; transition: transform 0.2s ease;
            margin-top: 15px;
        }

        .btn-submit:hover { transform: translateY(-3px); }

        #error-msg {
            margin-top: 25px; font-size: 0.85rem; color: #ff453a;
            min-height: 20px; font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="/assets/img/logo.png" alt="GupyMesa" class="brand-icon">
        <h1>GupyMesa</h1>
        <p class="tagline">Performance Inteligente</p>

        <form id="loginForm">
            <div class="form-group">
                <label>ID do Assistente</label>
                <input type="number" id="id" placeholder="Digite seu ID" required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Entrar no Painel</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script type="module">
        import { AuthEngine } from './src/engines/AuthEngine.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('id').value;
            const senha = document.getElementById('senha').value;
            const errorDiv = document.getElementById('error-msg');
            
            errorDiv.style.color = 'rgba(255,255,255,0.4)';
            errorDiv.textContent = 'Validando acesso...';

            try {
                await AuthEngine.login(id, senha);
                window.location.href = '/public/gestao.html';
            } catch (err) {
                errorDiv.style.color = '#ff453a';
                errorDiv.textContent = err.message;
            }
        });
    </script>
</body>
</html>
