<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão | GupyMesa</title>
    
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 overflow-x-hidden">

    <div id="menu-global"></div>

    <main class="w-full px-6 py-6">
        
        <div id="sub-menu-gestao"></div>

        <div id="conteudo-principal" class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 min-h-[calc(100vh-200px)] p-6">
            <div class="flex items-center justify-center h-full text-slate-300 animate-pulse">
                <p class="font-bold">Carregando dados...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { renderizarMenuSuperior } from '../src/components/MenuSuperior.js';
        import { GestaoManager } from '../src/managers/GestaoManager.js';

        document.addEventListener('DOMContentLoaded', () => {
            try {
                // 1. Renderiza o Menu Superior Global
                renderizarMenuSuperior('menu-global');
                
                // 2. Inicializa o Gerenciador da Página (Controla Abas, Filtros e Tabelas)
                GestaoManager.init();
            } catch (erro) {
                console.error("Erro crítico na inicialização:", erro);
                alert("Ocorreu um erro ao carregar o sistema. Verifique o console.");
            }
        });
    </script>
</body>
</html>
