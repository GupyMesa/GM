<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GupyMesa - Gestão de Performance</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --glass-white: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --accent: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -20%, #1a1a2e 0%, #050505 100%),
                radial-gradient(circle at 0% 100%, #0a0a1a 0%, transparent 40%);
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Container Principal */
        #app {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-out;
        }

        /* Menu Superior */
        #menu-superior {
            position: relative;
            z-index: 1000;
            margin-bottom: 40px;
        }

        /* Área de Conteúdo (Tabelas e Cards) */
        #conteudo-principal {
            position: relative;
            z-index: 1;
        }

        /* Animação de Entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="app">
        <div id="menu-superior"></div>
        <div id="conteudo-principal">
            <div style="text-align: center; padding: 50px; color: rgba(255,255,255,0.3);">
                Carregando painel...
            </div>
        </div>
    </div>

    <script type="module">
        import { GestaoManager } from '../src/managers/GestaoManager.js';

        // Inicializa o sistema assim que a página carrega
        document.addEventListener('DOMContentLoaded', () => {
            GestaoManager.init();
        });
    </script>
</body>
</html>
