<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GupyMesa - Gestão Integrada</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --accent: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e 0%, #050505 100%);
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* TELA CHEIA E RESPONSIVA */
        #app {
            /* Padding top 100px para o menu fixo não cobrir o conteúdo */
            padding: 100px 30px 30px 30px; 
            width: 100%;
            max-width: 100%; /* Garante uso total da tela */
            box-sizing: border-box; /* Garante que o padding não estoure a largura */
            animation: fadeIn 0.8s ease-out;
        }

        /* Menu Superior Fixo */
        #menu-superior {
            position: relative; z-index: 1000;
        }

        #submenu-gestao {
            margin-bottom: 25px; position: relative; z-index: 900;
        }

        #conteudo-principal {
            position: relative; z-index: 1; min-height: 400px;
        }

        #modal-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; pointer-events: none;
        }
        #modal-container > * { pointer-events: auto; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id="app">
        <div id="menu-superior"></div>
        <div id="submenu-gestao"></div>
        <div id="conteudo-principal"></div>
    </div>
    <div id="modal-container"></div>
    <script type="module">
        import { GestaoManager } from '../src/managers/GestaoManager.js';
        document.addEventListener('DOMContentLoaded', () => GestaoManager.init());
    </script>
</body>
</html>
